<!doctype html>

<title>Unable to load page | Charis Campaign Centre</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#f7f6fa;color:#241b36;font-family:Arial,Helvetica,sans-serif}
main{width:min(100%,480px);padding:38px 34px;background:#fff;border:1px solid #e9e4ef;border-radius:18px;box-shadow:0 16px 42px #2711550c;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:30px}
.brand img{width:46px;height:46px;border-radius:12px}
.brand strong{display:block;color:#2e1c5c;font-size:17px;letter-spacing:-.3px;text-align:left}
.brand span{display:block;margin-top:3px;color:#82798e;font-size:9px;font-weight:700;letter-spacing:1.1px;text-align:left}
.mark{width:48px;height:48px;margin:0 auto 18px;display:grid;place-items:center;border-radius:14px;background:#f2edfa;color:#5637a3}
.mark svg{width:23px;height:23px}
h1{margin:0 0 10px;font-size:23px;letter-spacing:-.55px}
p{margin:0;color:#6e667b;font-size:14px;line-height:1.7}
button{min-height:43px;margin-top:24px;padding:0 22px;border:0;border-radius:9px;background:#40239a;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
button:hover{background:#321879}
button:focus-visible{outline:3px solid #c9b9f0;outline-offset:3px}
small{display:block;margin-top:22px;color:#8a8295;font-size:11px;line-height:1.6}
@media(max-width:480px){main{padding:30px 22px}h1{font-size:21px}}
</style>
</head>
<body>
